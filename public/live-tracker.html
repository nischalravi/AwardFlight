<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Flight Tracker — Award Flights</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></div>
      <div class="logo-text">Award<span>Flights</span></div>
    </a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="search.html">Search Flights</a>
      <a href="live-tracker.html" class="active">Live Tracker</a>
      <a href="calculator.html">Points Calculator</a>
      <a href="deals.html">Hot Deals</a>
    </nav>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm">Sign In</button>
      <button class="btn btn-primary btn-sm">Sign Up</button>
    </div>
  </div>
</header>

<main style="padding-top: 68px;">
  <!-- Route bar -->
  <div style="position: sticky; top: 68px; z-index: 30; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: rgba(17, 24, 39, 0.92); border-bottom: 1px solid var(--border); padding: 12px 24px; backdrop-filter: blur(10px);">
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <div class="pill" id="pillRoute">—</div>
      <div class="pill" style="color: var(--text-dim);" id="pillCount">0 flights</div>
      <div class="pill" style="color: var(--text-dim);" id="pillUpdated">Not searched</div>
    </div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-ghost btn-sm" id="btnModify">Modify</button>
      <button class="btn btn-primary btn-sm" id="btnNew">New Search</button>
    </div>
  </div>

  <section class="tracker-layout" id="trackerSection">
    <!-- Sidebar -->
    <div class="tracker-sidebar" id="formCard">
      <div class="tracker-sidebar-head">
        <div class="live-badge" style="margin-bottom: 12px;">
          <span class="live-dot"></span> LIVE
        </div>

        <div style="margin-bottom: 12px; position: relative;">
          <label class="label">Origin (IATA or City)</label>
          <input class="input" id="from" autocomplete="off" placeholder="BOS or Boston">
          <div class="airport-dd" id="fromSuggest"></div>
        </div>

        <div style="margin-bottom: 12px; position: relative;">
          <label class="label">Destination (IATA or City)</label>
          <input class="input" id="to" autocomplete="off" placeholder="LHR or London Heathrow">
          <div class="airport-dd" id="toSuggest"></div>
        </div>

        <div style="margin-bottom: 12px;">
          <label class="label">Flight Number (optional)</label>
          <input class="input" id="flightNumber" autocomplete="off" placeholder="e.g., BA178">
          <p style="font-size: 12px; color: var(--text-dim); margin-top: 6px;">Tip: Filters the route results.</p>
        </div>

        <button class="btn btn-primary" id="btnTrack" style="width: 100%; padding: 14px;">
          🔍 Track Live Flights
        </button>

        <p style="font-size: 12px; color: var(--text-dim); margin-top: 10px;">
          Try: <strong>Boston → London</strong> (BOS → LHR)
        </p>

        <div id="formError" class="error-box"></div>
      </div>

      <div class="tracker-sidebar-list" id="flightsList">
        <!-- Flight cards rendered here by JS -->
      </div>
    </div>

    <!-- Globe -->
    <div class="tracker-globe">
      <div style="padding: 16px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h3 style="font-size: 16px;">3D Globe</h3>
          <p style="font-size: 12px; color: var(--text-dim);" id="globeSub">Search a route to plot flights.</p>
          <div id="weatherRow" style="display: none; margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap;"></div>
        </div>
        <span class="badge badge-accent" id="globeStatus">Idle</span>
      </div>
      <div id="globe" style="width: 100%; height: calc(100vh - 180px); border-top: 1px solid var(--border);"></div>
    </div>
  </section>
</main>

<script defer src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/globe.gl/dist/globe.gl.min.js"></script>
<script defer src="./airports-database.js"></script>
<script defer src="./airport-loader.js"></script>
<script defer src="./globe-3d.js"></script>
<script defer src="./live-tracker-client.js"></script>
</body>
</html>
